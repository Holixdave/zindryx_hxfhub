<script>
let audioCtx = null;
let recognition = null;
let isListeningForCommands = false;
let currentQuestionIndex = 2; // 0-based (showing Q3)
const totalQuestions = 10;
const questions = [
{q: "What is 2 + 2?", opts: ["2", "4", "8", "22"], correct: 1},
{q: "What is the capital of Nigeria?", opts: ["Lagos", "Abuja", "Kano", "Port Harcourt"], correct: 1},
{q: "If a triangle has angles of 40° and 70°, what is the third angle?", opts: ["50°", "60°", "70°", "80°"], correct: 1},
{q: "Who wrote 'Things Fall Apart'?", opts: ["Chinua Achebe", "Wole Soyinka", "Chimamanda Ngozi Adichie", "Ben Okri"], correct: 0}
];

function getAudioContext() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
return audioCtx;
}

function playTone(freq, type, duration) {
try {
const ctx = getAudioContext();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = type;
osc.frequency.setValueAtTime(freq, ctx.currentTime);
gain.gain.setValueAtTime(0.15, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + duration);
} catch(e) {}
}

function playSuccessChime() {
playTone(587.33, 'sine', 0.15);
setTimeout(() => playTone(880, 'sine', 0.35), 140);
}

function playErrorTone() {
playTone(220, 'sawtooth', 0.25);
setTimeout(() => playTone(180, 'sawtooth', 0.35), 200);
}

function playCommandChime() {
playTone(659.25, 'sine', 0.1); // E5
setTimeout(() => playTone(783.99, 'sine', 0.15), 80); // G5
}

function speakText(text, callback) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const u = new SpeechSynthesisUtterance(text);
u.rate = 0.9;
u.pitch = 1.0;
u.onend = () => { if (callback) callback(); };
window.speechSynthesis.speak(u);
} else {
setTimeout(() => { if (callback) callback(); }, 1600);
}
}

function initSpeechRecognition() {
if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
return null;
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = new SpeechRec();
rec.continuous = true;
rec.interimResults = false;
rec.lang = 'en-US';

rec.onresult = (event) => {
const transcript = event.results[event.resultIndex][0].transcript.trim().toLowerCase();
handleVoiceCommand(transcript);
};

rec.onerror = (event) => {
console.error('Speech recognition error:', event.error);
};

rec.onend = () => {
if (isListeningForCommands) {
rec.start(); // Restart if stopped
}
};

return rec;
}

function startCommandListening() {
if (!recognition) {
recognition = initSpeechRecognition();
}
if (recognition) {
isListeningForCommands = true;
recognition.start();
document.getElementById('waveBox').classList.add('active');
document.getElementById('statusMsg').textContent = 'Listening for commands...';
document.getElementById('micSubtext').textContent = 'Voice Active';
}
}

function stopCommandListening() {
isListeningForCommands = false;
if (recognition) {
recognition.stop();
}
document.getElementById('waveBox').classList.remove('active');
document.getElementById('statusMsg').textContent = 'Voice commands disabled • Tap mic to re-enable';
document.getElementById('micSubtext').textContent = 'Tap to Enable Voice';
}

function toggleVoice() {
const micBtn = document.getElementById('micBtn');
if (isListeningForCommands) {
stopCommandListening();
micBtn.classList.remove('listening');
} else {
startCommandListening();
micBtn.classList.add('listening');
speakText('Voice commands enabled. Say next, previous, submit, or repeat.');
}
}

function handleVoiceCommand(transcript) {
console.log('Heard:', transcript);
const status = document.getElementById('statusMsg');
const micSubtext = document.getElementById('micSubtext');

// Clear previous feedback
status.textContent = '';
micSubtext.textContent = 'Processing...';

setTimeout(() => {
micSubtext.textContent = isListeningForCommands ? 'Voice Active' : 'Tap to Enable Voice';
}, 1500);

if (transcript.includes('next') || transcript.includes('go forward')) {
playCommandChime();
status.textContent = '➡️ Moving to next question';
setTimeout(loadNextQuestion, 800);
} else if (transcript.includes('previous') || transcript.includes('go back') || transcript.includes('previous')) {
playCommandChime();
status.textContent = '⬅️ Going to previous question';
setTimeout(loadPreviousQuestion, 800);
} else if (transcript.includes('submit') || transcript.includes('lock in') || transcript.includes('answer')) {
playCommandChime();
status.textContent = '✅ Submitting answer';
// Simulate submitting current selection (for demo, we'll just show feedback)
setTimeout(() => {
const correctIdx = questions[currentQuestionIndex].correct;
document.getElementById(`opt${String.fromCharCode(65 + correctIdx)}`).classList.add('correct');
playSuccessChime();
speakText('Answer submitted. Correct!');
}, 1000);
} else if (transcript.includes('repeat') || transcript.includes('say again') || transcript.includes('what was')) {
playCommandChime();
status.textContent = '🔊 Repeating question';
speakText(questions[currentQuestionIndex].q, () => {
status.textContent = 'Tap mic or say a command';
});
} else {
// Unrecognized command
status.textContent = '❓ Try: next, previous, submit, or repeat';
micSubtext.textContent = 'Say again';
setTimeout(() => {
micSubtext.textContent = isListeningForCommands ? 'Voice Active' : 'Tap to Enable Voice';
}, 2000);
}
}

function loadNextQuestion() {
if (currentQuestionIndex < totalQuestions - 1) {
currentQuestionIndex++;
updateQuestionUI();
} else {
document.getElementById('statusMsg').textContent = '🎉 Exam complete!';
speakText('You have reached the end of the exam.');
}
}

function loadPreviousQuestion() {
if (currentQuestionIndex > 0) {
currentQuestionIndex--;
updateQuestionUI();
} else {
document.getElementById('statusMsg').textContent = '⏮️ Already at first question';
speakText('This is the first question.');
}
}

function updateQuestionUI() {
const q = questions[currentQuestionIndex];
document.getElementById('qText').textContent = q.q;
document.getElementById('optA').querySelector('span:last-child').textContent = q.opts[0];
document.getElementById('optB').querySelector('span:last-child').textContent = q.opts[1];
document.getElementById('optC').querySelector('span:last-child').textContent = q.opts[2];
document.getElementById('optD').querySelector('span:last-child').textContent = q.opts[3];

// Reset option highlights
['A','B','C','D'].forEach(opt => {
document.getElementById(`opt${opt}`).className = 'opt-row';
});

// Update progress
const progressPercent = ((currentQuestionIndex + 1) / totalQuestions) * 100;
document.querySelector('.progress-fill').style.width = progressPercent + '%';

// Update header
document.querySelector('.subject-title').textContent = `Mathematics • Question ${currentQuestionIndex + 1} of ${totalQuestions}`;

// Auto-speak new question if voice is active
if (isListeningForCommands) {
speakText(q.q);
}
}

// Initialize first question on load
window.onload = () => {
updateQuestionUI();
document.getElementById('statusMsg').textContent = 'Tap mic to begin • Say "repeat" to hear again';
};
</script>
