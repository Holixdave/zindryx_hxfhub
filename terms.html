<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Terms & Conditions for the Zindryx app.">

<link rel="shortcut icon" type="image/png" href="https://hbgkqfutpwgvxbzkhsvb.supabase.co/storage/v1/object/public/chat_storage/1788703263055_ai_images/1788703263055_scaled_favicon.png">
<link rel="apple-touch-icon" href="https://hbgkqfutpwgvxbzkhsvb.supabase.co/storage/v1/object/public/chat_storage/1788703260701_ai_images/1788703260701_scaled_zindryx-linking-logo.png">

<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem("zindryx-theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root { --accent:#BB86FC; --accent-strong:#3D2358; --radius:14px; --font-head:'Poppins',sans-serif; --font-body:'Lora',serif; }
  [data-theme="light"] { --bg:#F5F5F5; --surface:#FFFFFF; --surface-2:#FBFAFC; --border:#E4DEEC; --text:#1A0033; --text-secondary:#5C5468; --text-muted:#8B8494; --danger:#B3261E; }
  [data-theme="dark"] { --bg:#131019; --surface:#1C1C1E; --surface-2:#1A1A24; --border:#2E2A38; --text:#F2EEFA; --text-secondary:#B8B0C6; --text-muted:#837C90; --danger:#E5695F; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font-body); background:var(--bg); color:var(--text); line-height:1.7; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 56px; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom: 28px; }
  .brand { font-family:var(--font-head); font-weight:700; font-size:20px; color:var(--accent); text-decoration:none; display:flex; align-items:center; gap:8px; }
  .brand img { width:26px; height:26px; }
  .back { font-family:var(--font-head); font-size:13px; font-weight:600; color:var(--text-secondary); text-decoration:none; border:1px solid var(--border); background:var(--surface); padding:7px 12px; border-radius:8px; }
  h1 { font-family:var(--font-head); font-size: clamp(26px,5vw,36px); font-weight:600; margin:0 0 6px; }
  .sub { color:var(--text-muted); font-size:13.5px; margin:0 0 24px; }
  .doc { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding: 22px 22px 8px; }
  .doc p { margin: 0 0 16px; font-size: 15.5px; color: var(--text-secondary); }
  .doc p.bold { font-family:var(--font-head); font-weight:600; font-size:16px; color:var(--text); margin-top: 22px; }
  .doc p.bold:first-child { margin-top: 0; }
  .doc mark { background: none; color: var(--accent); font-weight: 600; }
  .state { text-align:center; padding: 28px 8px 34px; }
  .state p { margin: 0 0 14px; font-size:15px; color: var(--text-secondary); }
  .btn { font-family:var(--font-head); font-size:14px; font-weight:600; padding:11px 22px; border-radius:10px; border:none; background:var(--accent); color:var(--accent-strong); cursor:pointer; }
  .skeleton { height:12px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border); margin:0 0 14px; animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.45; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation:none; } }
  .hidden { display:none !important; }
  .foot { margin-top: 26px; font-size:12.5px; color:var(--text-muted); text-align:center; }
  .foot a { color:var(--accent); text-decoration:none; font-weight:500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/"><img src="https://hbgkqfutpwgvxbzkhsvb.supabase.co/storage/v1/object/public/chat_storage/1788703260701_ai_images/1788703260701_scaled_zindryx-linking-logo.png" alt="" aria-hidden="true">ZINDRYX</a>
    <a class="back" href="/docs">Back to help</a>
  </div>
  <h1>Terms & Conditions</h1>
  <p class="sub" id="subtitle">&nbsp;</p>

  <div class="doc">
    <div id="loading"><div class="skeleton" style="width:60%"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="width:80%"></div></div>
    <div id="error" class="state hidden"><p id="error-text">Couldn't load this page.</p><button class="btn" id="retry">Try again</button></div>
    <div id="content" class="hidden"></div>
  </div>

  <p class="foot">Questions? <a href="mailto:support@hxfhub.com">support@hxfhub.com</a> · <a href="/privacy">Privacy Policy</a></p>
</div>

<script type="module">
  const COLLECTION = "terms_condition";   // same collection the Zindryx app reads
  const HIGHLIGHT = ["zindryx", "hxf hub", "hxf", "kore", "guru"];  // same words the app highlights
  const $ = (id) => document.getElementById(id);

  // The app stores one document with fields policy_1, policy_2 ... and BoldPolicy_1 ... (headings).
  function parse(data) {
    const out = [];
    for (const [k, v] of Object.entries(data)) {
      const m = /^(BoldPolicy|policy)_(\d+)$/.exec(k);
      const text = typeof v === "string" ? v.trim() : "";
      if (m && text) out.push({ n: parseInt(m[2], 10), text, bold: m[1] === "BoldPolicy" });
    }
    return out.sort((a, b) => a.n - b.n);
  }

  // Wrap highlight words in <mark>, building DOM nodes (no innerHTML, so Firestore text can't inject markup).
  const re = new RegExp("(" + HIGHLIGHT.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  function fill(el, text) {
    text.split(re).forEach((part, i) => {
      if (i % 2) { const m = document.createElement("mark"); m.textContent = part; el.appendChild(m); }
      else if (part) el.appendChild(document.createTextNode(part));
    });
  }

  function view(name) {
    ["loading", "error", "content"].forEach(id => $(id).classList.toggle("hidden", id !== name));
  }

  async function load() {
    view("loading");
    try {
      const FB = "https://www.gstatic.com/firebasejs/10.13.0/";
      const [a, f] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-firestore.js")]);
      const app = a.initializeApp({
        apiKey: "AIzaSyCNSBIH65aJRhW9g90nKU58xd2HsvUnIEo", authDomain: "my-jamb-app.firebaseapp.com",
        projectId: "my-jamb-app", storageBucket: "my-jamb-app.firebasestorage.app",
        messagingSenderId: "317049651307", appId: "1:317049651307:web:0bf600cf4435a10a2c712e"
      });
      const snap = await f.getDocs(f.query(f.collection(f.getFirestore(app), COLLECTION), f.limit(1)));
      const doc = snap.docs[0];
      if (!doc) { $("error-text").textContent = "This page isn't available yet."; $("retry").classList.add("hidden"); view("error"); return; }
      const data = doc.data();
      const items = parse(data);
      if (!items.length) { $("error-text").textContent = "This page isn't available yet."; $("retry").classList.add("hidden"); view("error"); return; }
      const box = $("content");
      box.replaceChildren();
      items.forEach(it => { const p = document.createElement("p"); if (it.bold) p.className = "bold"; fill(p, it.text); box.appendChild(p); });
      const sub = [data.date, data.time].filter(x => typeof x === "string" && x).join(" • ");
      $("subtitle").textContent = sub || " ";
      view("content");
    } catch (e) {
      console.error("Couldn't load terms_condition:", e.code, e.message);
      $("error-text").textContent = e.code === "permission-denied" ? "This page is temporarily unavailable." : "Couldn't load this page. Check your connection and try again.";
      $("retry").classList.remove("hidden");
      view("error");
    }
  }
  $("retry").addEventListener("click", load);
  load();
</script>
<script>
  // keep the theme the visitor chose on the main pages
  try { var t = localStorage.getItem("zindryx-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</body>
</html>
